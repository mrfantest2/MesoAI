name: MASTER-PC Structure Inspect Temp

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/masterpc-structure-inspect-temp.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect MASTER-PC runner roots and KDT worker
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fantest.win/runner'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api.php?action=ping")" = 200
          curl -fsSL -c cookies.txt -b cookies.txt "$BASE/" -o runner.html
          CSRF="$(python - <<'PY'
          import re,json
          t=open('runner.html',encoding='utf-8',errors='replace').read();m=re.search(r'window\.FANTESTOS_RUNNER_CSRF=(.*?);',t)
          if not m: raise SystemExit('CSRF marker missing')
          print(json.loads(m.group(1)))
          PY
          )"
          cat > inspect.ps1 <<'PS1'
          $ErrorActionPreference='Continue'
          function O([string]$k,[object]$v){Write-Host ("{0}={1}" -f $k,$v)}
          function Get-Root([string]$svcName){$s=Get-CimInstance Win32_Service -Filter "Name='$svcName'" -ErrorAction SilentlyContinue;if(-not $s){return $null};$m=[regex]::Match([string]$s.PathName,'^\s*"([^\"]+RunnerService\.exe)"|^\s*([^\s]+RunnerService\.exe)');if(-not $m.Success){return $null};$exe=if($m.Groups[1].Success){$m.Groups[1].Value}else{$m.Groups[2].Value};return (Split-Path -Parent (Split-Path -Parent $exe))}
          $srcSvc='actions.runner.mrfantest2-Khalil-Digital-Twin.MASTER-PC-Khalil-Digital-Twin'
          $src=Get-Root $srcSvc;O 'SOURCE_ROOT' $src
          if($src){foreach($rel in @('bin\RunnerService.exe','bin\Runner.Listener.exe','externals','config.cmd','run.cmd','.runner','.credentials','.credentials_rsaparams','.service')){O ('SOURCE_'+($rel -replace '[^A-Za-z0-9]','_').ToUpper()) (Test-Path (Join-Path $src $rel))};if(Test-Path (Join-Path $src 'bin\Runner.Listener.exe')){try{O 'SOURCE_RUNNER_VERSION' (& (Join-Path $src 'bin\Runner.Listener.exe') --version|Select-Object -Last 1)}catch{O 'SOURCE_RUNNER_VERSION' 'ERROR'}}}
          $ccc='C:\actions-runner-ccc-control';O 'CCC_ROOT_EXISTS' (Test-Path $ccc)
          foreach($rel in @('bin\RunnerService.exe','bin\Runner.Listener.exe','externals','config.cmd','run.cmd','.runner','.credentials','.credentials_rsaparams','.service','_diag')){O ('CCC_'+($rel -replace '[^A-Za-z0-9]','_').ToUpper()) (Test-Path (Join-Path $ccc $rel))}
          if(Test-Path (Join-Path $ccc '.runner')){try{$j=Get-Content (Join-Path $ccc '.runner') -Raw|ConvertFrom-Json;O 'CCC_RUNNER_AGENT' $j.agentName;O 'CCC_RUNNER_WORK' $j.workFolder}catch{O 'CCC_RUNNER_JSON' 'ERROR'}}
          Write-Host 'KDT_TASKS_BEGIN'
          Get-ScheduledTask -ErrorAction SilentlyContinue | ForEach-Object {$t=$_;foreach($a in @($t.Actions)){if(([string]$a.Arguments -match '(?i)masterpc-job-agent|masterpc-control') -or ([string]$a.Execute -match '(?i)masterpc-job-agent')){Write-Host ("KDT_TASK name={0} state={1} execute={2} arguments={3}" -f $t.TaskName,$t.State,$a.Execute,([string]$a.Arguments -replace '(?i)(token|password|secret)=\S+','$1=[redacted]'))}}}
          Write-Host 'KDT_TASKS_END'
          Write-Host 'KDT_PROCESSES_BEGIN'
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {([string]$_.CommandLine) -match '(?i)masterpc-job-agent|masterpc-control'} | ForEach-Object {Write-Host ("KDT_PROCESS pid={0} name={1} cmd={2}" -f $_.ProcessId,$_.Name,([string]$_.CommandLine -replace '(?i)(token|password|secret)=\S+','$1=[redacted]'))}
          Write-Host 'KDT_PROCESSES_END'
          foreach($base in @('C:\xampp\htdocs\masterpc','C:\ProgramData\KhalilDigitalTwin')){if(Test-Path $base){Get-ChildItem $base -Recurse -File -Filter 'masterpc-job-agent.ps1' -ErrorAction SilentlyContinue|ForEach-Object{O 'KDT_AGENT_FILE' $_.FullName}}}
          $q='C:\xampp\private\masterpc-control\queue';$p='C:\xampp\private\masterpc-control\processed';if(Test-Path $q){O 'KDT_QUEUE_COUNT' (@(Get-ChildItem $q -Filter '*.json' -File -ErrorAction SilentlyContinue).Count)};if(Test-Path $p){O 'KDT_PROCESSED_COUNT' (@(Get-ChildItem $p -Filter '*.json' -File -ErrorAction SilentlyContinue).Count)}
          Write-Host 'MASTERPC_STRUCTURE_INSPECT=PASS'
          PS1
          curl -fsS -b cookies.txt -c cookies.txt -X POST "$BASE/api.php" --data-urlencode 'action=start' --data-urlencode "csrf=$CSRF" --data-urlencode 'runtime=powershell' --data-urlencode 'execution_mode=background' --data-urlencode 'working_directory=C:\' --data-urlencode 'timeout=300' --data-urlencode 'command@inspect.ps1' -o start.json
          JOB_ID="$(python - <<'PY'
          import json
          d=json.load(open('start.json'))
          if not d.get('ok') or not d.get('job_id'): raise SystemExit('queue failed')
          print(d['job_id'])
          PY
          )"
          out=0;err=0;:>stdout.log;:>stderr.log;final=''
          for i in $(seq 1 100); do
            curl -fsS -b cookies.txt -c cookies.txt "$BASE/api.php?action=status&csrf=$CSRF&job_id=$JOB_ID&out_offset=$out&err_offset=$err" -o status.json
            python - <<'PY' > parsed.env
          import json,shlex
          d=json.load(open('status.json'));print('STATUS='+shlex.quote(str(d.get('status',''))));print('OUT_OFFSET='+str(int(d.get('out_offset',0))));print('ERR_OFFSET='+str(int(d.get('err_offset',0))));open('chunk-out','wb').write(str(d.get('stdout_chunk','')).encode());open('chunk-err','wb').write(str(d.get('stderr_chunk','')).encode())
          PY
            . ./parsed.env;out=$OUT_OFFSET;err=$ERR_OFFSET;cat chunk-out >>stdout.log;cat chunk-err >>stderr.log;case "$STATUS" in completed|failed|cancelled|timed_out|output_limited) final="$STATUS";break;;esac;sleep 2
          done
          cat stdout.log
          if [ -s stderr.log ]; then echo '=== STDERR ==='; cat stderr.log; fi
          echo "FINAL=$final"; test "$final" = completed; grep -q 'MASTERPC_STRUCTURE_INSPECT=PASS' stdout.log

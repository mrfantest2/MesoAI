name: MesoAI Local XTTS Route Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - web/api/tts.php
      - web/chat/reply-audio.js
      - web/sw.js
      - tools/meso_xtts_client.py
      - deploy/deploy_to_xampp.ps1
      - .github/workflows/meso-xtts-route-preflight.yml

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Compile XTTS bridge
        run: python3 -m py_compile tools/meso_xtts_client.py

      - name: Enforce local XTTS MP3 route contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tts=Get-Content -LiteralPath './web/api/tts.php' -Raw
          $js=Get-Content -LiteralPath './web/chat/reply-audio.js' -Raw
          $helper=Get-Content -LiteralPath './tools/meso_xtts_client.py' -Raw
          foreach($needle in @('xtts-venv','meso_xtts_client.py','X-Meso-Voice: xtts-v2','X-Meso-Voice-Format: mp3','Content-Type: audio/mpeg')){
            if(-not $tts.Contains($needle)){throw "Missing XTTS MP3 route marker: $needle"}
          }
          if($tts -match 'fish-live|fish-s2'){throw 'Fish live route remains in tts.php'}
          if($js -match 'Meso Fish|Fish S2|_mesoFish'){throw 'Fish UI route remains in reply-audio.js'}
          foreach($needle in @("engine !== 'xtts-v2'","format !== 'mp3'","audio/mpeg",'playPreparedXtts','createPreparedAudio','Local XTTS ready','Playback blocked')){
            if(-not $js.Contains($needle)){throw "Missing Android MP3 playback marker: $needle"}
          }
          if($js -match "Accept': 'audio/wav"){throw 'Browser still requests WAV'}
          foreach($needle in @('libmp3lame','C:\ffmpeg\bin\ffmpeg.exe','format\": \"mp3')){
            if(-not $helper.Contains($needle)){throw "Missing MP3 bridge marker: $needle"}
          }
          if($helper -notmatch 'synthesize_wav' -or $helper -notmatch 'transcode_mp3'){throw 'XTTS-to-MP3 bridge stages missing'}
          $sw=Get-Content -LiteralPath './web/sw.js' -Raw
          if(-not $sw.Contains("meso-app-shell-v4")){throw 'PWA cache version was not advanced to v4'}
          Write-Host 'MESO_XTTS_MP3_STATIC_ROUTE=PASS'

      - name: PHP syntax check
        run: php -l web/api/tts.php

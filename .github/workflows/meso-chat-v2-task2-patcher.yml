name: MesoAI Chat v2 Task 2 Patcher

on:
  push:
    branches: [feature/meso-chat-v2-task2]
    paths:
      - .github/workflows/meso-chat-v2-task2-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/meso-chat-v2-task2
          fetch-depth: 0

      - name: Apply deterministic Task 2 integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # Memory: lookup an exact persisted message without changing schema.
          replace_once(
              'web/includes/memory.php',
              "function meso_memory_add_message(string $conversationId, string $role, string $content, array $meta = []): array {",
              """function meso_memory_get_message(string $conversationId, string $messageId): ?array {
    if (!meso_memory_valid_id($conversationId) || !meso_memory_valid_id($messageId)) return null;
    $stmt = meso_memory_db()->prepare('SELECT seq,id,conversation_id,role,content,created_at,provider,model,persona_version,persona_grounding,persona_evidence_count,voice_profile FROM messages WHERE id=:id AND conversation_id=:conversation_id LIMIT 1');
    $stmt->execute([':id'=>$messageId, ':conversation_id'=>$conversationId]);
    $row = $stmt->fetch();
    return is_array($row) ? meso_memory_map_message($row) : null;
}

function meso_memory_add_message(string $conversationId, string $role, string $content, array $meta = []): array {"""
          )

          # API: regeneration reuses the original user turn and history strictly before it.
          replace_once(
              'web/api/chat.php',
              """$conversationId=strtolower(trim((string)($body['conversation_id']??'')));
if(!meso_memory_valid_id($conversationId)) fail_json(400,'invalid_conversation_id');
$message=trim((string)($body['message']??''));
if($message===''||mb_strlen($message)>8000) fail_json(400,'invalid_message');

try {
    $conversation=meso_memory_get_conversation($conversationId);
    if($conversation===null) throw new InvalidArgumentException('conversation_not_found');
    if(($conversation['archived']??false)===true) throw new InvalidArgumentException('conversation_archived');
    $recent=meso_memory_list_messages($conversationId,12,null)['items'];
    $memoryContext=meso_memory_context($conversationId,$message,6);
} catch(Throwable $e) {
    meso_chat_memory_fail($e);
}""",
              """$conversationId=strtolower(trim((string)($body['conversation_id']??'')));
if(!meso_memory_valid_id($conversationId)) fail_json(400,'invalid_conversation_id');
$incomingMessage=trim((string)($body['message']??''));
$regenerateMessageId=strtolower(trim((string)($body['regenerate_message_id']??'')));
$sourceUserMessage=null;
$message='';

try {
    $conversation=meso_memory_get_conversation($conversationId);
    if($conversation===null) throw new InvalidArgumentException('conversation_not_found');
    if(($conversation['archived']??false)===true) throw new InvalidArgumentException('conversation_archived');

    if($regenerateMessageId!==''){
        if(!meso_memory_valid_id($regenerateMessageId)) throw new InvalidArgumentException('invalid_regenerate_message_id');
        $sourceUserMessage=meso_memory_get_message($conversationId,$regenerateMessageId);
        if($sourceUserMessage===null) throw new InvalidArgumentException('regenerate_message_not_found');
        if((string)($sourceUserMessage['role']??'')!=='user') throw new InvalidArgumentException('regenerate_message_not_user');
        $message=(string)$sourceUserMessage['content'];
        $recent=meso_memory_list_messages($conversationId,12,$regenerateMessageId)['items'];
    } else {
        $message=$incomingMessage;
        if($message===''||mb_strlen($message)>8000) throw new InvalidArgumentException('invalid_message');
        $recent=meso_memory_list_messages($conversationId,12,null)['items'];
    }
    $memoryContext=meso_memory_context($conversationId,$message,6);
} catch(Throwable $e) {
    meso_chat_memory_fail($e);
}"""
          )

          replace_once(
              'web/api/chat.php',
              """try {
    $userMessage=meso_memory_add_message($conversationId,'user',$message);
    $explicitRemember=meso_memory_extract_explicit_remember($message);
    if($explicitRemember!==null){
        meso_memory_create_item($conversationId,$userMessage['id'],'fact',$explicitRemember,'verified','user-explicit-chat');
    }
} catch(Throwable $e) {
    meso_chat_memory_fail($e);
}""",
              """try {
    if($sourceUserMessage!==null){
        $userMessage=$sourceUserMessage;
    } else {
        $userMessage=meso_memory_add_message($conversationId,'user',$message);
        $explicitRemember=meso_memory_extract_explicit_remember($message);
        if($explicitRemember!==null){
            meso_memory_create_item($conversationId,$userMessage['id'],'fact',$explicitRemember,'verified','user-explicit-chat');
        }
    }
} catch(Throwable $e) {
    meso_chat_memory_fail($e);
}"""
          )

          replace_once(
              'web/api/chat.php',
              """$resultBase=[
    'conversation_id'=>$conversationId,
    'memory'=>'meso-memory-v1',""",
              """$resultBase=[
    'conversation_id'=>$conversationId,
    'user_message_id'=>(string)$userMessage['id'],
    'regenerated_from'=>$sourceUserMessage!==null?(string)$sourceUserMessage['id']:null,
    'memory'=>'meso-memory-v1',"""
          )

          # Client: render assistant Markdown safely and attach Copy/Regenerate actions.
          replace_once(
              'web/chat/chat.js',
              "function addMessage(role,text,meta=''){const empty=messages.querySelector('.empty');if(empty)messages.replaceChildren();const card=document.createElement('div');card.className=`msg ${role}`;const label=document.createElement('div');label.className='role';label.textContent=meta?`${role} · ${meta}`:role;const body=document.createElement('div');body.textContent=String(text??'');card.append(label,body);messages.appendChild(card);messages.scrollTop=messages.scrollHeight;}",
              """function addMessage(role,text,meta='',options={}){const empty=messages.querySelector('.empty');if(empty)messages.replaceChildren();const card=document.createElement('div');card.className=`msg ${role}`;const label=document.createElement('div');label.className='role';label.textContent=meta?`${role} · ${meta}`:role;const body=document.createElement('div');body.className='messageBody';const plain=String(text??'');if(role==='assistant'&&typeof window.mesoRenderAssistant==='function')window.mesoRenderAssistant(body,plain);else body.textContent=plain;card.append(label,body);const userMessageId=String(options?.userMessageId||'');if(role==='assistant'&&typeof window.mesoAttachMessageActions==='function')window.mesoAttachMessageActions(card,{text:plain,onRegenerate:validId(userMessageId)?()=>regenerateMessage(userMessageId):undefined});messages.appendChild(card);messages.scrollTop=messages.scrollHeight;return card;}"""
          )

          replace_once(
              'web/chat/chat.js',
              "for(const item of items){const role=String(item?.role||'');if(role!=='user'&&role!=='assistant')continue;addMessage(role,String(item?.content||''),messageMeta(item));}",
              """let lastUserMessageId='';
    for(const item of items){
      const role=String(item?.role||'');
      if(role!=='user'&&role!=='assistant')continue;
      const itemId=String(item?.id||'');
      if(role==='user'){
        lastUserMessageId=validId(itemId)?itemId:'';
        addMessage(role,String(item?.content||''),messageMeta(item));
      }else{
        addMessage(role,String(item?.content||''),messageMeta(item),{userMessageId:lastUserMessageId});
      }
    }"""
          )

          replace_once(
              'web/chat/chat.js',
              "  async function sendText(){",
              """  function responseMeta(body){
    const persona=`persona · ${String(body?.persona||'off')}`;
    const grounding=String(body?.persona_grounding||'off');
    const groundingPart=grounding&&grounding!=='off'?` · ${grounding}`:'';
    const evidence=Number(body?.persona_evidence||0)>0?` · evidence ${Number(body.persona_evidence)}`:'';
    const remembered=Number(body?.memory_items_used||0)>0?` · memory ${Number(body.memory_items_used)}`:'';
    return `${body?.provider||''}${body?.model?` · ${body.model}`:''} · ${persona}${groundingPart}${evidence}${remembered}`;
  }

  async function regenerateMessage(userMessageId){
    const id=String(userMessageId||'');
    if(!validId(id)||!validId(activeConversationId)||send.disabled)return;
    setBusy(true,`Regenerating · Persona ${activePersona} · Memory v1…`);
    try{
      const response=await fetch('/meso/api/chat.php',{method:'POST',credentials:'same-origin',cache:'no-store',headers:stateJsonHeaders,body:JSON.stringify({conversation_id:activeConversationId,regenerate_message_id:id})});
      const body=await readJson(response);
      if(!response.ok||!body.ok)throw new Error(body.message||body.error||`HTTP ${response.status}`);
      if(String(body.conversation_id||'')!==activeConversationId)throw new Error('conversation_response_mismatch');
      if(String(body.user_message_id||'')!==id)throw new Error('regenerate_user_message_mismatch');
      if(!validId(String(body.message_id||'')))throw new Error('invalid_message_id');
      activePersona=String(body.persona||'off');
      activeGrounding=String(body.persona_grounding||'off');
      addMessage('assistant',body.reply,responseMeta(body),{userMessageId:id});
      window.dispatchEvent(new CustomEvent('meso:memory-changed',{detail:{conversation_id:activeConversationId}}));
    }catch(error){
      addMessage('assistant',`Regenerate error: ${error.message}`,'system');
    }finally{
      setBusy(false);input.focus();
    }
  }

  async function sendText(){"""
          )

          old_meta="""      activePersona=String(body.persona||'off');
      activeGrounding=String(body.persona_grounding||'off');
      const persona=`persona · ${activePersona}`;
      const grounding=activeGrounding&&activeGrounding!=='off'?` · ${activeGrounding}`:'';
      const evidence=Number(body.persona_evidence||0)>0?` · evidence ${Number(body.persona_evidence)}`:'';
      const remembered=Number(body.memory_items_used||0)>0?` · memory ${Number(body.memory_items_used)}`:'';
      const meta=`${body.provider||''}${body.model?` · ${body.model}`:''} · ${persona}${grounding}${evidence}${remembered}`;
      addMessage('assistant',body.reply,meta);"""
          new_meta="""      activePersona=String(body.persona||'off');
      activeGrounding=String(body.persona_grounding||'off');
      const userMessageId=String(body.user_message_id||'');
      if(!validId(userMessageId))throw new Error('invalid_user_message_id');
      addMessage('assistant',body.reply,responseMeta(body),{userMessageId});"""
          replace_once('web/chat/chat.js',old_meta,new_meta)

          # Page: load renderer before chat and give actions compact styling.
          replace_once(
              'web/chat/index.php',
              '<script src="/meso/chat/chat.js" defer></script>',
              '<script src="/meso/chat/render.js" defer></script>\n<script src="/meso/chat/chat.js" defer></script>'
          )
          replace_once(
              'web/chat/index.php',
              '.role{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;margin-bottom:5px}',
              '.role{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;margin-bottom:5px}.messageBody p{margin:.45em 0}.messageBody p:first-child{margin-top:0}.messageBody p:last-child{margin-bottom:0}.messageBody pre{overflow:auto;background:#090c12;border:1px solid var(--line);border-radius:10px;padding:10px}.messageBody code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.messageBody a{color:var(--accent)}.messageActions{display:flex;gap:6px;margin-top:9px}.messageAction{border:1px solid #343b4d;border-radius:8px;background:#151925;color:var(--muted);padding:5px 8px;font-size:11px;cursor:pointer}.messageAction:hover{color:var(--txt);border-color:#5a6682}'
          )

          print('MESO_CHAT_V2_TASK2_PATCH=APPLIED')

      - name: Verify syntax and runtime contract
        run: |
          php -l web/includes/memory.php
          php -l web/api/chat.php
          php -l web/chat/index.php
          php tests/chat_v2_regenerate_contract.php
          node --check web/chat/chat.js
          node --check web/chat/render.js

      - name: Commit integrated Task 2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/meso-chat-v2-task2-patcher.yml
          git add web/includes/memory.php web/api/chat.php web/chat/chat.js web/chat/index.php
          git commit -m 'feat: integrate Chat v2 render actions and regeneration'
          git push origin HEAD:feature/meso-chat-v2-task2

name: MASTER-PC KDT Control Recover Temp

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/masterpc-control-recover-temp.yml"]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Restart KDT control worker and verify ping
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fantest.win/runner'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api.php?action=ping")" = 200
          curl -fsSL -c cookies.txt -b cookies.txt "$BASE/" -o runner.html
          CSRF="$(python - <<'PY'
          import re,json
          t=open('runner.html',encoding='utf-8',errors='replace').read();m=re.search(r'window\.FANTESTOS_RUNNER_CSRF=(.*?);',t)
          if not m: raise SystemExit('CSRF marker missing')
          print(json.loads(m.group(1)))
          PY
          )"
          cat > repair.ps1 <<'PS1'
          $ErrorActionPreference='Stop'
          function O([string]$k,[object]$v){Write-Host ("{0}={1}" -f $k,$v)}
          $task='KDT MasterPC Job Control'
          $before=Get-ScheduledTask -TaskName $task -ErrorAction Stop
          O 'KDT_TASK_BEFORE' $before.State
          Stop-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Start-ScheduledTask -TaskName $task -ErrorAction Stop
          Start-Sleep -Seconds 3
          O 'KDT_TASK_AFTER' (Get-ScheduledTask -TaskName $task).State
          $q='C:\xampp\private\masterpc-control\queue';$p='C:\xampp\private\masterpc-control\processed'
          New-Item -ItemType Directory -Force -Path $q,$p|Out-Null
          $id='fullflight_ping_'+(Get-Date -Format 'yyyyMMdd_HHmmss_fff')
          $tmp=Join-Path $q ($id+'.json.tmp');$dst=Join-Path $q ($id+'.json');$done=Join-Path $p ($id+'.json')
          $json=(@{id=$id;action='diagnostic_ping';repository=''}|ConvertTo-Json -Compress)
          [IO.File]::WriteAllText($tmp,$json,(New-Object Text.UTF8Encoding($false)));Move-Item $tmp $dst -Force
          $deadline=(Get-Date).AddSeconds(60)
          while((Get-Date)-lt $deadline -and -not(Test-Path $done)){Start-Sleep -Milliseconds 500}
          if(-not(Test-Path $done)){throw 'KDT diagnostic_ping was not processed after worker restart.'}
          $r=Get-Content $done -Raw|ConvertFrom-Json
          O 'KDT_PING_RESULT' $r.result;O 'KDT_PING_DETAIL' $r.detail
          if($r.result -ne 'success' -or $r.detail -ne 'pong'){throw 'KDT diagnostic_ping failed.'}
          foreach($u in @('http://127.0.0.1/masterpc/','http://127.0.0.1:8784/api/v1/health','http://127.0.0.1:8766/api/status','http://127.0.0.1:4096/')){try{$x=Invoke-WebRequest $u -UseBasicParsing -TimeoutSec 8;Write-Host "LOCAL_HTTP url=$u status=$($x.StatusCode)"}catch{throw "Local endpoint failed: $u :: $($_.Exception.Message)"}}
          if(Test-Path 'C:\xampp\private\masterpc-control\snapshot.json'){$s=Get-Content 'C:\xampp\private\masterpc-control\snapshot.json' -Raw|ConvertFrom-Json;O 'KDT_SNAPSHOT_GENERATED' $s.generated_at;O 'KDT_RUNNER_ONLINE' $s.runner.online;O 'KDT_RUNNER_BUSY' $s.runner.busy}
          O 'KDT_QUEUE_REMAINING' (@(Get-ChildItem $q -Filter '*.json' -File -ErrorAction SilentlyContinue).Count)
          Write-Host 'KDT_CONTROL_RECOVERY=PASS'
          PS1
          curl -fsS -b cookies.txt -c cookies.txt -X POST "$BASE/api.php" --data-urlencode 'action=start' --data-urlencode "csrf=$CSRF" --data-urlencode 'runtime=powershell' --data-urlencode 'execution_mode=background' --data-urlencode 'working_directory=C:\' --data-urlencode 'timeout=300' --data-urlencode 'command@repair.ps1' -o start.json
          JOB_ID="$(python - <<'PY'
          import json
          d=json.load(open('start.json'))
          if not d.get('ok') or not d.get('job_id'): raise SystemExit('queue failed')
          print(d['job_id'])
          PY
          )"
          out=0;err=0;:>stdout.log;:>stderr.log;final=''
          for i in $(seq 1 100); do
            curl -fsS -b cookies.txt -c cookies.txt "$BASE/api.php?action=status&csrf=$CSRF&job_id=$JOB_ID&out_offset=$out&err_offset=$err" -o status.json
            python - <<'PY' > parsed.env
          import json,shlex
          d=json.load(open('status.json'));print('STATUS='+shlex.quote(str(d.get('status',''))));print('OUT_OFFSET='+str(int(d.get('out_offset',0))));print('ERR_OFFSET='+str(int(d.get('err_offset',0))));open('chunk-out','wb').write(str(d.get('stdout_chunk','')).encode());open('chunk-err','wb').write(str(d.get('stderr_chunk','')).encode())
          PY
            . ./parsed.env;out=$OUT_OFFSET;err=$ERR_OFFSET;cat chunk-out >>stdout.log;cat chunk-err >>stderr.log;case "$STATUS" in completed|failed|cancelled|timed_out|output_limited) final="$STATUS";break;;esac;sleep 2
          done
          cat stdout.log
          if [ -s stderr.log ]; then echo '=== STDERR ==='; cat stderr.log; fi
          echo "FINAL=$final";test "$final" = completed;grep -q 'KDT_CONTROL_RECOVERY=PASS' stdout.log

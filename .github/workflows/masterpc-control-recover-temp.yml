name: MASTER-PC KDT Post-Patch Audit

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/masterpc-control-recover-temp.yml"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read post-patch KDT audit and safe queue metadata
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fantest.win/runner'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api.php?action=ping")" = 200
          curl -fsSL -c cookies.txt -b cookies.txt "$BASE/" -o runner.html
          CSRF="$(python - <<'PY'
          import re,json
          t=open('runner.html',encoding='utf-8',errors='replace').read();m=re.search(r'window\.FANTESTOS_RUNNER_CSRF=(.*?);',t)
          if not m: raise SystemExit('CSRF marker missing')
          print(json.loads(m.group(1)))
          PY
          )"
          cat > diag.ps1 <<'PS1'
          $ErrorActionPreference='Continue'
          function O([string]$k,[object]$v){Write-Host ("{0}={1}" -f $k,$v)}
          $q='C:\xampp\private\masterpc-control\queue';$p='C:\xampp\private\masterpc-control\processed';$a='C:\xampp\private\masterpc-control\audit.jsonl'
          O 'QUEUE_COUNT' (@(Get-ChildItem $q -Filter '*.json' -File -ErrorAction SilentlyContinue).Count)
          foreach($f in @(Get-ChildItem $q -Filter '*.json' -File -ErrorAction SilentlyContinue|Sort-Object CreationTimeUtc)){
            try{$j=Get-Content $f.FullName -Raw|ConvertFrom-Json;$keys=@($j.PSObject.Properties.Name);Write-Host ("QUEUE_META file={0} age_sec={1} keys={2} action={3} repo_present={4} run_id_present={5} job_id_present={6}" -f $f.Name,[int]((Get-Date)-$f.CreationTime).TotalSeconds,($keys -join ','),([string]$j.action),($keys -contains 'repository'),($keys -contains 'run_id'),($keys -contains 'job_id'))}catch{Write-Host ("QUEUE_META file={0} parse_error={1}" -f $f.Name,$_.Exception.Message)}
          }
          Write-Host 'AUDIT_TAIL_BEGIN'
          if(Test-Path $a){Get-Content $a -Tail 20|ForEach-Object{try{$j=$_|ConvertFrom-Json;Write-Host ("AUDIT at={0} type={1} action={2} result={3} detail={4} error={5}" -f $j.at,$j.type,$j.action,$j.result,(([string]$j.detail)-replace '(?i)(token|authorization|credential|password|secret)[^ ]*','[redacted]'),(([string]$j.error)-replace '(?i)(token|authorization|credential|password|secret)[^ ]*','[redacted]'))}catch{}}}
          Write-Host 'AUDIT_TAIL_END'
          $task=Get-ScheduledTaskInfo -TaskName 'KDT MasterPC Job Control' -ErrorAction SilentlyContinue;if($task){O 'TASK_LAST_RESULT' $task.LastTaskResult;O 'TASK_LAST_RUN' $task.LastRunTime.ToString('o')}
          $procs=@(Get-CimInstance Win32_Process|Where-Object{([string]$_.CommandLine)-match '(?i)masterpc-job-agent\.ps1'});O 'AGENT_PROCESS_COUNT' $procs.Count
          foreach($x in $procs){$gp=Get-Process -Id $x.ProcessId -ErrorAction SilentlyContinue;Write-Host ("AGENT pid={0} start={1:o} cpu={2}" -f $x.ProcessId,$gp.StartTime,$gp.CPU)}
          Write-Host 'POST_PATCH_AUDIT=PASS'
          PS1
          curl -fsS -b cookies.txt -c cookies.txt -X POST "$BASE/api.php" --data-urlencode 'action=start' --data-urlencode "csrf=$CSRF" --data-urlencode 'runtime=powershell' --data-urlencode 'execution_mode=background' --data-urlencode 'working_directory=C:\' --data-urlencode 'timeout=120' --data-urlencode 'command@diag.ps1' -o start.json
          JOB_ID="$(python - <<'PY'
          import json
          d=json.load(open('start.json'))
          if not d.get('ok') or not d.get('job_id'): raise SystemExit('queue failed')
          print(d['job_id'])
          PY
          )"
          out=0;err=0;:>stdout.log;:>stderr.log;final=''
          for i in $(seq 1 80); do
            curl -fsS -b cookies.txt -c cookies.txt "$BASE/api.php?action=status&csrf=$CSRF&job_id=$JOB_ID&out_offset=$out&err_offset=$err" -o status.json
            python - <<'PY' > parsed.env
          import json,shlex
          d=json.load(open('status.json'));print('STATUS='+shlex.quote(str(d.get('status',''))));print('OUT_OFFSET='+str(int(d.get('out_offset',0))));print('ERR_OFFSET='+str(int(d.get('err_offset',0))));open('chunk-out','wb').write(str(d.get('stdout_chunk','')).encode());open('chunk-err','wb').write(str(d.get('stderr_chunk','')).encode())
          PY
            . ./parsed.env;out=$OUT_OFFSET;err=$ERR_OFFSET;cat chunk-out >>stdout.log;cat chunk-err >>stderr.log;case "$STATUS" in completed|failed|cancelled|timed_out|output_limited) final="$STATUS";break;;esac;sleep 1
          done
          cat stdout.log;if [ -s stderr.log ];then echo '=== STDERR ===';cat stderr.log;fi;echo "FINAL=$final";test "$final" = completed;grep -q 'POST_PATCH_AUDIT=PASS' stdout.log

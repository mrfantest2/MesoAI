name: MASTER-PC KDT Control Priority RED

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/masterpc-control-recover-temp.yml"]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prove current deployed agent violates control-priority contract
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fantest.win/runner'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api.php?action=ping")" = 200
          curl -fsSL -c cookies.txt -b cookies.txt "$BASE/" -o runner.html
          CSRF="$(python - <<'PY'
          import re,json
          t=open('runner.html',encoding='utf-8',errors='replace').read();m=re.search(r'window\.FANTESTOS_RUNNER_CSRF=(.*?);',t)
          if not m: raise SystemExit('CSRF marker missing')
          print(json.loads(m.group(1)))
          PY
          )"
          cat > red.ps1 <<'PS1'
          $ErrorActionPreference='Stop'
          $path='C:\xampp\private\masterpc-control\agent\masterpc-job-agent.ps1'
          $text=Get-Content -LiteralPath $path -Raw
          $marker="Write-Audit @{ type='agent_start'"
          $start=$text.IndexOf($marker,[StringComparison]::Ordinal)
          if($start -lt 0){throw 'Agent main loop marker not found.'}
          $tail=$text.Substring($start)
          $processPos=$tail.IndexOf('Process-Commands $cfg $auth.token $controlSnapshot',[StringComparison]::Ordinal)
          $collectPos=$tail.IndexOf('Collect-Snapshot $cfg $auth.token $auth.source',[StringComparison]::Ordinal)
          if($processPos -lt 0){throw 'RED_EXPECTED: control-priority Process-Commands call is missing.'}
          if($collectPos -lt 0){throw 'Collect-Snapshot call is missing.'}
          if($processPos -gt $collectPos){throw 'RED_EXPECTED: control commands are processed after snapshot collection.'}
          if($tail -notmatch "Name='Runner\.Worker\.exe'"){throw 'RED_EXPECTED: local Runner.Worker state is not sampled before control.'}
          Write-Host 'UNEXPECTED_GREEN'
          PS1
          curl -fsS -b cookies.txt -c cookies.txt -X POST "$BASE/api.php" --data-urlencode 'action=start' --data-urlencode "csrf=$CSRF" --data-urlencode 'runtime=powershell' --data-urlencode 'execution_mode=background' --data-urlencode 'working_directory=C:\' --data-urlencode 'timeout=120' --data-urlencode 'command@red.ps1' -o start.json
          JOB_ID="$(python - <<'PY'
          import json
          d=json.load(open('start.json'))
          if not d.get('ok') or not d.get('job_id'): raise SystemExit('queue failed')
          print(d['job_id'])
          PY
          )"
          out=0;err=0;:>stdout.log;:>stderr.log;final=''
          for i in $(seq 1 60); do
            curl -fsS -b cookies.txt -c cookies.txt "$BASE/api.php?action=status&csrf=$CSRF&job_id=$JOB_ID&out_offset=$out&err_offset=$err" -o status.json
            python - <<'PY' > parsed.env
          import json,shlex
          d=json.load(open('status.json'));print('STATUS='+shlex.quote(str(d.get('status',''))));print('OUT_OFFSET='+str(int(d.get('out_offset',0))));print('ERR_OFFSET='+str(int(d.get('err_offset',0))));open('chunk-out','wb').write(str(d.get('stdout_chunk','')).encode());open('chunk-err','wb').write(str(d.get('stderr_chunk','')).encode())
          PY
            . ./parsed.env;out=$OUT_OFFSET;err=$ERR_OFFSET;cat chunk-out >>stdout.log;cat chunk-err >>stderr.log;case "$STATUS" in completed|failed|cancelled|timed_out|output_limited) final="$STATUS";break;;esac;sleep 1
          done
          cat stdout.log;cat stderr.log || true;echo "FINAL=$final"
          grep -q 'RED_EXPECTED:' stderr.log
          ! grep -q 'UNEXPECTED_GREEN' stdout.log
          echo 'RED_PHASE=PASS'

name: MASTER-PC KDT Control Priority GREEN

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/masterpc-control-recover-temp.yml"]

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Patch live KDT worker, restart, and verify regression
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fantest.win/runner'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api.php?action=ping")" = 200
          curl -fsSL -c cookies.txt -b cookies.txt "$BASE/" -o runner.html
          CSRF="$(python - <<'PY'
          import re,json
          t=open('runner.html',encoding='utf-8',errors='replace').read();m=re.search(r'window\.FANTESTOS_RUNNER_CSRF=(.*?);',t)
          if not m: raise SystemExit('CSRF marker missing')
          print(json.loads(m.group(1)))
          PY
          )"
          cat > green.ps1 <<'PS1'
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          function O([string]$k,[object]$v){Write-Host ("{0}={1}" -f $k,$v)}
          $path='C:\xampp\private\masterpc-control\agent\masterpc-job-agent.ps1'
          $text=Get-Content -LiteralPath $path -Raw
          $old=@'
          do {
            try {
              $auth = Resolve-GitHubToken
              $snapshot = if ($auth.token) { Collect-Snapshot $cfg $auth.token $auth.source } else {
                $services=@(Get-RunnerServices); [ordered]@{schema_version=1;generated_at=IsoNow;hostname=$env:COMPUTERNAME;auth=@{state='missing';source=$auth.source};runner=@{online=@($services|Where-Object{$_.state -eq 'Running'}).Count -gt 0;busy=$false;services=$services};counts=@{running=0;queued=0;attention=0;failed=0;total=0};jobs=@();errors=@('Persistent GitHub authentication is not configured for the MASTER-PC job-control agent.')}
              }
              Write-JsonAtomic $SnapshotPath $snapshot
              Process-Commands $cfg $auth.token $snapshot
            } catch {
          '@
          $new=@'
          do {
            try {
              $auth = Resolve-GitHubToken
              $controlServices = @(Get-RunnerServices)
              $controlBusy = @(Get-CimInstance Win32_Process -Filter "Name='Runner.Worker.exe'" -ErrorAction SilentlyContinue).Count -gt 0
              $controlSnapshot = [ordered]@{ runner=[ordered]@{ online=@($controlServices|Where-Object{$_.state -eq 'Running'}).Count -gt 0; busy=$controlBusy; services=$controlServices } }
              Process-Commands $cfg $auth.token $controlSnapshot
              $snapshot = if ($auth.token) { Collect-Snapshot $cfg $auth.token $auth.source } else {
                $services=@(Get-RunnerServices); [ordered]@{schema_version=1;generated_at=IsoNow;hostname=$env:COMPUTERNAME;auth=@{state='missing';source=$auth.source};runner=@{online=@($services|Where-Object{$_.state -eq 'Running'}).Count -gt 0;busy=$false;services=$services};counts=@{running=0;queued=0;attention=0;failed=0;total=0};jobs=@();errors=@('Persistent GitHub authentication is not configured for the MASTER-PC job-control agent.')}
              }
              Write-JsonAtomic $SnapshotPath $snapshot
            } catch {
          '@
          if(-not $text.Contains($old)){throw 'Expected production main-loop block was not found; refusing blind edit.'}
          $stamp=Get-Date -Format 'yyyyMMdd_HHmmss';Copy-Item -LiteralPath $path -Destination ($path+'.pre-control-priority-'+$stamp+'.bak') -Force
          $patched=$text.Replace($old,$new)
          [IO.File]::WriteAllText($path,$patched,(New-Object Text.UTF8Encoding($false)))
          $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -gt 0){throw ('PowerShell parse errors: '+(@($errors|ForEach-Object{$_.Message}) -join ' | '))}
          O 'PATCH_APPLIED' $true
          $tail=$patched.Substring($patched.IndexOf("Write-Audit @{ type='agent_start'",[StringComparison]::Ordinal))
          $processPos=$tail.IndexOf('Process-Commands $cfg $auth.token $controlSnapshot',[StringComparison]::Ordinal)
          $collectPos=$tail.IndexOf('Collect-Snapshot $cfg $auth.token $auth.source',[StringComparison]::Ordinal)
          if($processPos -lt 0 -or $collectPos -lt 0 -or $processPos -gt $collectPos){throw 'Control-priority structural regression test failed after patch.'}
          if($tail -notmatch "Name='Runner\.Worker\.exe'"){throw 'Local Runner.Worker sampling missing after patch.'}
          O 'STRUCTURAL_TEST' 'PASS'
          $task='KDT MasterPC Job Control';Stop-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue;Start-Sleep -Seconds 2;Start-ScheduledTask -TaskName $task -ErrorAction Stop;Start-Sleep -Seconds 3;O 'KDT_TASK' (Get-ScheduledTask -TaskName $task).State
          $q='C:\xampp\private\masterpc-control\queue';$p='C:\xampp\private\masterpc-control\processed';New-Item -ItemType Directory -Force -Path $q,$p|Out-Null
          $id='green_ping_'+(Get-Date -Format 'yyyyMMdd_HHmmss_fff');$tmp=Join-Path $q ($id+'.json.tmp');$dst=Join-Path $q ($id+'.json');$done=Join-Path $p ($id+'.json');$json=(@{id=$id;action='diagnostic_ping';repository=''}|ConvertTo-Json -Compress);[IO.File]::WriteAllText($tmp,$json,(New-Object Text.UTF8Encoding($false)));Move-Item $tmp $dst -Force
          $deadline=(Get-Date).AddSeconds(20);while((Get-Date)-lt $deadline -and -not(Test-Path $done)){Start-Sleep -Milliseconds 250}
          if(-not(Test-Path $done)){throw 'GREEN failed: diagnostic_ping was not processed within 20 seconds.'}
          $r=Get-Content $done -Raw|ConvertFrom-Json;O 'PING_RESULT' $r.result;O 'PING_DETAIL' $r.detail;if($r.result -ne 'success' -or $r.detail -ne 'pong'){throw 'GREEN failed: diagnostic_ping result is not success/pong.'}
          foreach($u in @('http://127.0.0.1/masterpc/','http://127.0.0.1:8784/api/v1/health','http://127.0.0.1:8766/api/status','http://127.0.0.1:4096/')){$x=Invoke-WebRequest $u -UseBasicParsing -TimeoutSec 8;Write-Host "LOCAL_HTTP url=$u status=$($x.StatusCode)";if($x.StatusCode -ne 200){throw "Non-200 local endpoint: $u"}}
          O 'QUEUE_REMAINING' (@(Get-ChildItem $q -Filter '*.json' -File -ErrorAction SilentlyContinue).Count)
          Write-Host 'GREEN_PHASE=PASS'
          PS1
          curl -fsS -b cookies.txt -c cookies.txt -X POST "$BASE/api.php" --data-urlencode 'action=start' --data-urlencode "csrf=$CSRF" --data-urlencode 'runtime=powershell' --data-urlencode 'execution_mode=background' --data-urlencode 'working_directory=C:\' --data-urlencode 'timeout=240' --data-urlencode 'command@green.ps1' -o start.json
          JOB_ID="$(python - <<'PY'
          import json
          d=json.load(open('start.json'))
          if not d.get('ok') or not d.get('job_id'): raise SystemExit('queue failed')
          print(d['job_id'])
          PY
          )"
          out=0;err=0;:>stdout.log;:>stderr.log;final=''
          for i in $(seq 1 120); do
            curl -fsS -b cookies.txt -c cookies.txt "$BASE/api.php?action=status&csrf=$CSRF&job_id=$JOB_ID&out_offset=$out&err_offset=$err" -o status.json
            python - <<'PY' > parsed.env
          import json,shlex
          d=json.load(open('status.json'));print('STATUS='+shlex.quote(str(d.get('status',''))));print('OUT_OFFSET='+str(int(d.get('out_offset',0))));print('ERR_OFFSET='+str(int(d.get('err_offset',0))));open('chunk-out','wb').write(str(d.get('stdout_chunk','')).encode());open('chunk-err','wb').write(str(d.get('stderr_chunk','')).encode())
          PY
            . ./parsed.env;out=$OUT_OFFSET;err=$ERR_OFFSET;cat chunk-out >>stdout.log;cat chunk-err >>stderr.log;case "$STATUS" in completed|failed|cancelled|timed_out|output_limited) final="$STATUS";break;;esac;sleep 1
          done
          cat stdout.log
          if [ -s stderr.log ]; then echo '=== STDERR ===';cat stderr.log;fi
          echo "FINAL=$final";test "$final" = completed;grep -q 'GREEN_PHASE=PASS' stdout.log

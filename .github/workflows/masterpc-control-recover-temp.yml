name: MASTER-PC KDT Optional IDs GREEN

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/masterpc-control-recover-temp.yml"]

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Patch StrictMode-safe optional IDs and verify live queue
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fantest.win/runner'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api.php?action=ping")" = 200
          curl -fsSL -c cookies.txt -b cookies.txt "$BASE/" -o runner.html
          CSRF="$(python - <<'PY'
          import re,json
          t=open('runner.html',encoding='utf-8',errors='replace').read();m=re.search(r'window\.FANTESTOS_RUNNER_CSRF=(.*?);',t)
          if not m: raise SystemExit('CSRF marker missing')
          print(json.loads(m.group(1)))
          PY
          )"
          cat > green.ps1 <<'PS1'
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          function O([string]$k,[object]$v){Write-Host ("{0}={1}" -f $k,$v)}
          $path='C:\xampp\private\masterpc-control\agent\masterpc-job-agent.ps1'
          $lines=[Collections.Generic.List[string]]::new();foreach($line in (Get-Content -LiteralPath $path)){[void]$lines.Add([string]$line)}
          $hits=@()
          for($i=0;$i -lt $lines.Count;$i++){if($lines[$i] -like '*$record = [ordered]@{*' -and $lines[$i] -like '*run_id=if($cmd){$cmd.run_id}*' -and $lines[$i] -like '*job_id=if($cmd){$cmd.job_id}*'){$hits+=$i}}
          O 'UNSAFE_RECORD_HITS' $hits.Count
          if($hits.Count -ne 1){throw 'Expected exactly one unsafe Process-Commands record line.'}
          $idx=[int]$hits[0];$stamp=Get-Date -Format 'yyyyMMdd_HHmmss';Copy-Item $path ($path+'.pre-optional-ids-'+$stamp+'.bak') -Force
          $lines.RemoveAt($idx)
          $replacement=@(
            "    `$runId = if (`$cmd -and `$cmd.PSObject.Properties['run_id']) { `$cmd.run_id } else { `$null }",
            "    `$jobId = if (`$cmd -and `$cmd.PSObject.Properties['job_id']) { `$cmd.job_id } else { `$null }",
            "    `$record = [ordered]@{ id=`$id; processed_at=IsoNow; action=if(`$cmd){[string]`$cmd.action}else{''}; repository=if(`$cmd){[string]`$cmd.repository}else{''}; run_id=`$runId; job_id=`$jobId; result=`$result; detail=`$detail }"
          )
          for($j=$replacement.Count-1;$j -ge 0;$j--){$lines.Insert($idx,$replacement[$j])}
          [IO.File]::WriteAllLines($path,$lines,(New-Object Text.UTF8Encoding($false)))
          $tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null;if(@($errors).Count -gt 0){throw ('Parse errors: '+(@($errors|ForEach-Object{$_.Message}) -join ' | '))}
          $text=Get-Content $path -Raw
          if($text -notmatch "PSObject\.Properties\['run_id'\]" -or $text -notmatch "PSObject\.Properties\['job_id'\]"){throw 'Optional-ID structural regression test failed.'}
          $tail=$text.Substring($text.IndexOf("Write-Audit @{ type='agent_start'",[StringComparison]::Ordinal));$pp=$tail.IndexOf('Process-Commands $cfg $auth.token $controlSnapshot');$cp=$tail.IndexOf('Collect-Snapshot $cfg $auth.token $auth.source');if($pp -lt 0 -or $cp -lt 0 -or $pp -gt $cp){throw 'Control-priority regression reappeared.'}
          O 'STRUCTURAL_TESTS' 'PASS'
          $task='KDT MasterPC Job Control';Stop-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue;Start-Sleep -Seconds 2;Start-ScheduledTask -TaskName $task -ErrorAction Stop;Start-Sleep -Seconds 3;O 'KDT_TASK' (Get-ScheduledTask -TaskName $task).State
          $q='C:\xampp\private\masterpc-control\queue';$p='C:\xampp\private\masterpc-control\processed'
          $id='strict_green_'+(Get-Date -Format 'yyyyMMdd_HHmmss_fff');$tmp=Join-Path $q ($id+'.json.tmp');$dst=Join-Path $q ($id+'.json');$done=Join-Path $p ($id+'.json');$json=(@{id=$id;action='diagnostic_ping';repository=''}|ConvertTo-Json -Compress);[IO.File]::WriteAllText($tmp,$json,(New-Object Text.UTF8Encoding($false)));Move-Item $tmp $dst -Force
          $deadline=(Get-Date).AddSeconds(20);while((Get-Date)-lt $deadline -and -not(Test-Path $done)){Start-Sleep -Milliseconds 250}
          if(-not(Test-Path $done)){throw 'Fresh diagnostic_ping not processed within 20 seconds.'}
          $r=Get-Content $done -Raw|ConvertFrom-Json;O 'PING_RESULT' $r.result;O 'PING_DETAIL' $r.detail;if($r.result -ne 'success' -or $r.detail -ne 'pong'){throw 'Fresh diagnostic_ping did not return success/pong.'}
          $drain=(Get-Date).AddSeconds(10);while((Get-Date)-lt $drain -and @(Get-ChildItem $q -Filter '*.json' -File -ErrorAction SilentlyContinue).Count -gt 0){Start-Sleep -Milliseconds 250}
          O 'QUEUE_REMAINING' (@(Get-ChildItem $q -Filter '*.json' -File -ErrorAction SilentlyContinue).Count)
          foreach($u in @('http://127.0.0.1/masterpc/','http://127.0.0.1:8784/api/v1/health','http://127.0.0.1:8766/api/status','http://127.0.0.1:4096/')){$x=Invoke-WebRequest $u -UseBasicParsing -TimeoutSec 8;Write-Host "LOCAL_HTTP url=$u status=$($x.StatusCode)";if($x.StatusCode -ne 200){throw "Non-200 local endpoint: $u"}}
          Write-Host 'KDT_OPTIONAL_IDS_GREEN=PASS'
          PS1
          curl -fsS -b cookies.txt -c cookies.txt -X POST "$BASE/api.php" --data-urlencode 'action=start' --data-urlencode "csrf=$CSRF" --data-urlencode 'runtime=powershell' --data-urlencode 'execution_mode=background' --data-urlencode 'working_directory=C:\' --data-urlencode 'timeout=240' --data-urlencode 'command@green.ps1' -o start.json
          JOB_ID="$(python - <<'PY'
          import json
          d=json.load(open('start.json'))
          if not d.get('ok') or not d.get('job_id'): raise SystemExit('queue failed')
          print(d['job_id'])
          PY
          )"
          out=0;err=0;:>stdout.log;:>stderr.log;final=''
          for i in $(seq 1 120); do
            curl -fsS -b cookies.txt -c cookies.txt "$BASE/api.php?action=status&csrf=$CSRF&job_id=$JOB_ID&out_offset=$out&err_offset=$err" -o status.json
            python - <<'PY' > parsed.env
          import json,shlex
          d=json.load(open('status.json'));print('STATUS='+shlex.quote(str(d.get('status',''))));print('OUT_OFFSET='+str(int(d.get('out_offset',0))));print('ERR_OFFSET='+str(int(d.get('err_offset',0))));open('chunk-out','wb').write(str(d.get('stdout_chunk','')).encode());open('chunk-err','wb').write(str(d.get('stderr_chunk','')).encode())
          PY
            . ./parsed.env;out=$OUT_OFFSET;err=$ERR_OFFSET;cat chunk-out >>stdout.log;cat chunk-err >>stderr.log;case "$STATUS" in completed|failed|cancelled|timed_out|output_limited) final="$STATUS";break;;esac;sleep 1
          done
          cat stdout.log;if [ -s stderr.log ];then echo '=== STDERR ===';cat stderr.log;fi;echo "FINAL=$final";test "$final" = completed;grep -q 'KDT_OPTIONAL_IDS_GREEN=PASS' stdout.log

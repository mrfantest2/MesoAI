name: MesoAI Chat v2 Checks

on:
  push:
    branches: [feature/meso-v3-program-recovered, feature/meso-chat-v2-task2, feature/meso-chat-v2-streaming, feature/meso-v22-live-voice]
    paths:
      - web/includes/memory.php
      - web/includes/chat_runtime.php
      - web/api/chat.php
      - web/api/chat-stream.php
      - web/chat/index.php
      - web/chat/chat.js
      - web/chat/chat-v2.css
      - web/chat/conversations.js
      - web/chat/render.js
      - web/sw.js
      - tests/chat_v2_regenerate_contract.php
      - .github/workflows/meso-chat-v2-checks.yml
  pull_request:
    branches: [main]
    paths:
      - web/includes/memory.php
      - web/includes/chat_runtime.php
      - web/api/chat.php
      - web/api/chat-stream.php
      - web/chat/index.php
      - web/chat/chat.js
      - web/chat/chat-v2.css
      - web/chat/conversations.js
      - web/chat/render.js
      - web/sw.js
      - tests/chat_v2_regenerate_contract.php
      - .github/workflows/meso-chat-v2-checks.yml

permissions:
  contents: read

jobs:
  chat-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          php -l web/includes/memory.php
          php -l web/includes/chat_runtime.php
          php -l web/api/chat.php
          php -l web/api/chat-stream.php
          php -l web/chat/index.php
          php -l tests/chat_v2_regenerate_contract.php
          node --check web/chat/chat.js
          node --check web/chat/conversations.js
          node --check web/chat/render.js
          node --check web/sw.js

      - name: Regeneration identity contract
        run: php tests/chat_v2_regenerate_contract.php

      - name: Persistent conversation navigator contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page=Path('web/chat/index.php').read_text(encoding='utf-8')
          js=Path('web/chat/conversations.js').read_text(encoding='utf-8')
          chat=Path('web/chat/chat.js').read_text(encoding='utf-8')
          sw=Path('web/sw.js').read_text(encoding='utf-8')
          for marker in ('conversationList','archivedConversationList','conversationDrawer','conversationDrawerToggle'):
              assert marker in page, marker
          for marker in ('/meso/api/conversations.php','/meso/api/messages.php','mesoConversationController','meso:conversation-changed','rename','archive','delete'):
              assert marker in js, marker
          assert 'textContent' in js
          assert 'innerHTML' not in js
          assert 'meso.activeConversation.v1' in chat
          assert 'mesoConversationController' in chat
          assert "url.pathname.startsWith('/meso/api/')" in sw
          print('MESO_CHAT_V2_CONVERSATIONS=PASS')
          PY

      - name: Safe rendering and message actions contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          render=Path('web/chat/render.js').read_text(encoding='utf-8')
          chat=Path('web/chat/chat.js').read_text(encoding='utf-8')
          api=Path('web/api/chat.php').read_text(encoding='utf-8')
          runtime=Path('web/includes/chat_runtime.php').read_text(encoding='utf-8')
          memory=Path('web/includes/memory.php').read_text(encoding='utf-8')
          page=Path('web/chat/index.php').read_text(encoding='utf-8')
          for marker in ('mesoRenderAssistant','mesoAttachMessageActions','createTextNode','clipboard','Regenerate','Copy'):
              assert marker in render, marker
          assert 'innerHTML' not in render
          assert 'javascript:' not in render.lower()
          assert 'noopener noreferrer' in render
          assert 'mesoRenderAssistant' in chat
          assert 'mesoAttachMessageActions' in chat
          assert 'regenerateMessage' in chat
          assert 'regenerate_message_id' in chat
          assert "'user_message_id'" in api or 'user_message_id' in runtime
          assert 'regenerate_message_id' in api or 'regenerate_message_id' in runtime
          assert 'meso_memory_get_message' in runtime
          assert 'function meso_memory_get_message' in memory
          assert '/meso/chat/render.js' in page
          print('MESO_CHAT_V2_RENDER_ACTIONS=PASS')
          PY

      - name: Shared runtime parity contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          runtime=Path('web/includes/chat_runtime.php').read_text(encoding='utf-8')
          api=Path('web/api/chat.php').read_text(encoding='utf-8')
          for marker in ('meso_chat_provider_config','meso_chat_prepare_request','meso_chat_context_for','meso_chat_persist_user_turn','meso_chat_persist_assistant_turn','meso_chat_openai_extract_text'):
              assert marker in runtime, marker
              assert marker in api, f'chat.php does not consume {marker}'
          for duplicate in ('function provider_config','function rate_limit_or_fail','function curl_json','function extract_openai_text'):
              assert duplicate not in api, duplicate
          assert "'keep_alive'=>-1" in api
          assert '300' in api
          assert 'MESO_PRIVATE' not in api
          print('MESO_CHAT_V2_RUNTIME=PASS')
          PY

      - name: Streaming endpoint contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          stream=Path('web/api/chat-stream.php').read_text(encoding='utf-8')
          runtime=Path('web/includes/chat_runtime.php').read_text(encoding='utf-8')
          for marker in ('text/event-stream','meso_chat_require_json_state_auth','meso_chat_sse_event','CURLOPT_WRITEFUNCTION','connection_aborted','meso_chat_persist_assistant_turn'):
              assert marker in stream, marker
          assert "'stream'=>true" in stream
          assert "'keep_alive'=>-1" in stream
          assert '300' in stream
          assert 'Cache-Control: no-store' in stream
          assert 'echo $chunk' not in stream
          assert 'provider_secrets' not in stream.lower()
          assert 'meso_chat_prepare_request' in stream and 'meso_chat_context_for' in stream and 'meso_chat_persist_user_turn' in stream
          assert 'meso_chat_stream_limit' in runtime
          print('MESO_CHAT_V2_STREAM_SERVER=PASS')
          PY

      - name: Client stream cancel fallback contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          chat=Path('web/chat/chat.js').read_text(encoding='utf-8')
          for marker in ('AbortController','/meso/api/chat-stream.php','TextDecoder','stopGeneration','deltaAccepted','fallbackEligible','regenerate_message_id','user_message_id'):
              assert marker in chat, marker
          assert 'eval(' not in chat
          assert 'response.body.getReader()' in chat
          assert "eventName==='delta'" in chat or "eventName === 'delta'" in chat
          assert 'controller.abort()' in chat
          assert 'validId(userMessageId)' in chat, 'fallback must reuse persisted user message id'
          print('MESO_CHAT_V2_STREAM_CLIENT=PASS')
          PY

      - name: Mobile PWA state polish contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          chat=Path('web/chat/chat.js').read_text(encoding='utf-8')
          css=Path('web/chat/chat-v2.css').read_text(encoding='utf-8')
          sw=Path('web/sw.js').read_text(encoding='utf-8')
          assert 'meso-app-shell-v13' in sw
          assert '/meso/chat/chat-v2.css' in sw
          static=sw.split('const STATIC_ASSETS = [',1)[1].split('];',1)[0]
          for asset in ('/meso/chat/chat.js','/meso/chat/conversations.js','/meso/chat/memory.js','/meso/chat/render.js'):
              assert asset not in static, f'{asset} must stay network-only'
          assert "url.pathname.startsWith('/meso/api/')" in sw
          for marker in ('Historical evidence','Conversation memory','autoHeight','e.shiftKey','stopGeneration'):
              assert marker in chat, marker
          assert 'overflow-x:hidden' in css.replace(' ','')
          assert 'min-height:44px' in css.replace(' ','')
          assert 'env(safe-area-inset-bottom)' in css
          print('MESO_CHAT_V2_MOBILE_PWA=PASS')
          PY

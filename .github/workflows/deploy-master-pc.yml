name: MesoAI MASTER-PC Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesoai-master-pc-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, khalil-master-pc]
    timeout-minutes: 10
    steps:
      - name: Checkout MesoAI
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify target path
        shell: powershell
        run: |
          $target = 'C:\xampp\htdocs\meso'
          if ($target -ne 'C:\xampp\htdocs\meso') { throw 'Unexpected MesoAI web target' }
          Write-Host "Deploy target: $target"

      - name: Deploy MesoAI web to XAMPP
        shell: powershell
        run: |
          .\deploy\deploy_to_xampp.ps1 -RepoRoot $env:GITHUB_WORKSPACE -Target 'C:\xampp\htdocs\meso'

      - name: Verify local MesoAI page
        shell: powershell
        run: |
          $r = Invoke-WebRequest -Uri 'http://127.0.0.1/meso/' -UseBasicParsing -TimeoutSec 15
          if ($r.StatusCode -ne 200) { throw "Local MesoAI returned HTTP $($r.StatusCode)" }
          if ($r.Content -notmatch 'MesoAI') { throw 'Local page does not identify as MesoAI' }
          Write-Host 'MesoAI local verification passed.'

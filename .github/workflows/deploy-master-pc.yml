name: MesoAI Release Source Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep the historical group so this GitHub-hosted gate cancels any stale
# MesoAI-owned MASTER-PC deploy run that could never acquire a runner.
concurrency:
  group: mesoai-master-pc-deploy
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical MesoAI source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify production deploy boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy/deploy_to_xampp.ps1
          test -f web/chat/index.php
          test -f web/chat/chat.js
          test -f web/chat/memory.js
          test -f web/chat/reply-audio.js
          test -f web/includes/memory.php
          test -f web/api/chat.php
          test -f web/api/conversations.php
          test -f web/api/messages.php
          test -f web/api/memory.php
          test -f web/api/tts.php
          test -f web/api/transcribe.php
          test -f tools/memory_v1_bootstrap.php
          test -f web/app.webmanifest
          test -f web/sw.js
          grep -q 'application/manifest+json' web/.htaccess
          grep -q 'beforeinstallprompt' web/pwa/install.js
          grep -q "url.pathname.startsWith('/meso/api/')" web/sw.js
          grep -q 'meso-memory-v1' web/api/chat.php
          grep -q 'MESO_MEMORY_V1_READY=true' deploy/deploy_to_xampp.ps1
          echo 'MESO_MAIN_SOURCE_GATE=true'
          echo 'MESO_MEMORY_V1_SOURCE_GATE=true'
          echo 'MASTER_PC_DEPLOY_OWNER=Khalil-Digital-Twin/mesoai-deploy-bridge'
          echo 'MASTER_PC_SELF_HOSTED_RUNNER_REQUIRED=false'
          echo 'RUNPOD_STARTED=false'

      - name: Record deployment contract
        shell: bash
        run: |
          echo 'MesoAI is the canonical product source.'
          echo 'MASTER-PC deployment is intentionally executed only through the private KDT bridge.'
          echo 'Memory v1 persists only under the private MesoAI runtime root and is never copied into htdocs.'

name: Meso Voice v2.1 Lab TDD

on:
  push:
    branches:
      - preflight-write/meso-next

permissions:
  contents: read

jobs:
  voice-v21-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP CLI
        run: |
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq php-cli
          fi

      - name: Voice v2.1 blind lab contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          required = [
              Path('tools/meso_xtts_lab_client.py'),
              Path('web/voice-lab/index.php'),
              Path('web/voice-lab/voice-lab.js'),
              Path('web/api/voice-lab.php'),
              Path('web/api/voice-lab-audio.php'),
          ]
          for p in required:
              assert p.is_file(), f'missing {p}'

          helper = required[0].read_text(encoding='utf-8')
          page = required[1].read_text(encoding='utf-8')
          js = required[2].read_text(encoding='utf-8')
          api = required[3].read_text(encoding='utf-8')
          audio = required[4].read_text(encoding='utf-8')
          combined = '\n'.join((page, js, api, audio))

          assert r'C:\MesoAI\private\voice-lab\profile-map.json' in helper
          assert '/data/voice/profiles/khalil' in helper
          assert 'speaker_wav' in helper and 'xtts-v2' in helper
          assert "{'A','B','C','D'}" in helper.replace(' ', '') or "{'A', 'B', 'C', 'D'}" in helper
          assert 'meso_chat_require_json_auth' in api
          assert 'meso_chat_require_json_auth' in audio
          assert 'Accept-Ranges: bytes' in audio
          assert 'Content-Range: bytes' in audio
          assert 'profile-map.json' not in combined
          assert 'WhatsApp' not in combined and 'Instagram' not in combined
          assert 'single-best-whatsapp' not in combined
          assert 'four-clean-whatsapp' not in combined
          assert 'hybrid-two-whatsapp-two-instagram' not in combined
          assert 'A' in page and 'B' in page and 'C' in page and 'D' in page
          assert '/meso/api/voice-lab.php' in js
          assert '/meso/api/voice-lab-audio.php' in js
          print('MESO_VOICE_V21_BLIND_LAB_STATIC=PASS')
          PY

      - name: Syntax
        run: |
          python3 -m py_compile tools/meso_xtts_lab_client.py
          node --check web/voice-lab/voice-lab.js
          php -l web/voice-lab/index.php
          php -l web/api/voice-lab.php
          php -l web/api/voice-lab-audio.php

      - name: Reject private media and source identities in Git
        run: |
          bad="$(git ls-files | grep -Ei '\.(wav|mp3|m4a|aac|opus|ogg|flac|zip|7z)$' || true)"
          if [ -n "$bad" ]; then
            echo "$bad" >&2
            exit 1
          fi
          if grep -RniE '00008012-AUDIO|00007407-AUDIO|00009632-AUDIO|00010216-AUDIO|maissoun_moussa_[0-9]+' web tools; then
            echo 'Private source identity leaked into tracked source.' >&2
            exit 1
          fi
          echo 'MESO_VOICE_V21_PRIVATE_MEDIA_GIT=PASS'

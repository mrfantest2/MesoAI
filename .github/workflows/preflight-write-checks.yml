name: MesoAI Preflight Write Checks

on:
  push:
    branches:
      - preflight-write/meso-next
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n tools/run_fish_s2_ephemeral.sh

      - name: Python compile
        run: python3 -m py_compile tools/*.py

      - name: JavaScript syntax
        run: node --check web/chat/chat.js

      - name: PowerShell deployment syntax
        shell: pwsh
        run: |
          foreach ($path in @(
            'deploy/deploy_to_xampp.ps1',
            'deploy/fish_s2_remote_preflight.ps1',
            'deploy/fish_s2_remote_handoff.ps1',
            'deploy/fish_s2_run.ps1'
          )) {
            $text = Get-Content -LiteralPath $path -Raw
            [void][scriptblock]::Create($text)
            Write-Host "POWERSHELL_SYNTAX_OK=$path"
          }

      - name: Install PHP CLI
        run: |
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq php-cli
          fi

      - name: PHP syntax
        run: |
          php -l web/includes/chat_auth.php
          php -l web/chat/index.php
          php -l web/api/chat.php
          php -l web/api/transcribe.php
          php -l web/api/local-chat-bootstrap.php
          php -l web/api/status.php

      - name: Public privacy invariants
        run: |
          if grep -RniE 'Jamal' web; then
            echo 'Removed speaker name reappeared in public web source.' >&2
            exit 1
          fi
          legacy="$(grep -RniE 'negative_audio|negative_duration' web || true)"
          unexpected="$(printf '%s\n' "$legacy" | grep -vE '^web/api/status\.php:.*unset\(' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Removed speaker fields reappeared outside the defensive status unset:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          test ! -e web/api/local-xtts-license.php
          if grep -nE 'onclick=|<script>[[:space:]]*$' web/chat/index.php; then
            echo 'Inline chat JavaScript reappeared.' >&2
            exit 1
          fi
          echo 'MESO_PUBLIC_PRIVACY_STATIC_OK=true'

      - name: Local chat STT isolation invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          endpoint = Path('web/api/transcribe.php').read_text(encoding='utf-8')
          helper = Path('tools/transcribe_chat_audio.py').read_text(encoding='utf-8')
          chat = Path('web/chat/chat.js').read_text(encoding='utf-8')
          page = Path('web/chat/index.php').read_text(encoding='utf-8')
          deploy = Path('deploy/deploy_to_xampp.ps1').read_text(encoding='utf-8')
          assert 'meso_chat_require_json_auth' in endpoint
          assert '"provider_upload": False' in helper
          assert r'C:\MesoAI\private\chat-stt' in helper
          assert 'transcribe.php' in chat
          assert 'microphone=(self)' in page
          assert 'MESO_CHAT_STT_RUNTIME_STAGED=true' in deploy
          forbidden = ('api.openai.com', 'api.anthropic.com', 'googleapis.com', 'deepgram', 'assemblyai')
          combined = (endpoint + '\n' + helper).lower()
          assert not any(item in combined for item in forbidden)
          print('MESO_LOCAL_CHAT_STT_ISOLATION_OK=true')
          PY

      - name: Fish fail-closed invariants
        run: |
          grep -q 'MESO_FISH_LICENSE_ACCEPTED' tools/run_fish_s2_ephemeral.sh
          grep -q 'PROJECT_SLUG' tools/run_fish_s2_ephemeral.sh
          grep -q 'ExpectedHostKeySha256' deploy/fish_s2_remote_preflight.ps1
          grep -q 'MESO_FISH_ZERO_DATA_REMOTE_PREFLIGHT' deploy/fish_s2_remote_preflight.ps1
          grep -q 'private_data_transferred = \$false' deploy/fish_s2_remote_preflight.ps1
          grep -q 'ExpectedHostKeySha256' deploy/fish_s2_remote_handoff.ps1
          grep -q 'SharedWorkRoot' deploy/fish_s2_remote_handoff.ps1
          grep -q 'ProjectSlug' deploy/fish_s2_remote_handoff.ps1
          grep -q 'MESO_FISH_REMOTE_INPUT_HASHES_VERIFIED' deploy/fish_s2_remote_handoff.ps1
          grep -q 'MESO_FISH_DOWNLOADED_OUTPUTS_VERIFIED' deploy/fish_s2_remote_handoff.ps1
          grep -q 'MESO_FISH_ORCHESTRATOR_LICENSE_GATE' deploy/fish_s2_run.ps1
          grep -q 'MESO_FISH_ORCHESTRATOR_ZERO_DATA_PREFLIGHT_COMPLETE' deploy/fish_s2_run.ps1
          grep -q 'MESO_FISH_ORCHESTRATOR_PRIVATE_HANDOFF_COMPLETE' deploy/fish_s2_run.ps1
          python3 - <<'PY'
          from pathlib import Path
          s = Path('deploy/fish_s2_run.ps1').read_text(encoding='utf-8')
          assert s.index('& $preflight @preflightArgs') < s.index('& $handoff @handoffArgs')
          h = Path('deploy/fish_s2_remote_handoff.ps1').read_text(encoding='utf-8')
          assert 'KEEP_WORKDIR=1' in h
          assert 'rm -rf -- $RemoteRoot' in h
          assert 'rm -rf -- $SharedWorkRoot' not in h
          print('MESO_FISH_SHARED_CACHE_ISOLATION_OK=true')
          PY
          echo 'MESO_FISH_PREFLIGHT_STATIC_OK=true'

      - name: Reject private media in Git
        run: |
          bad="$(git ls-files | grep -Ei '\.(wav|mp3|m4a|aac|opus|ogg|flac|zip|7z)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Private/media archive file extensions are tracked:' >&2
            echo "$bad" >&2
            exit 1
          fi
          echo 'MESO_NO_TRACKED_PRIVATE_MEDIA=true'

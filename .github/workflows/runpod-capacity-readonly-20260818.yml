name: RunPod Capacity Readonly 20260818

on:
  push:
    branches: [runpod-capacity-readonly-20260818]
    paths:
      - .github/workflows/runpod-capacity-readonly-20260818.yml

permissions:
  contents: read

jobs:
  capacity:
    runs-on: [self-hosted, Windows, X64, khalil-voice]
    timeout-minutes: 5
    steps:
      - name: Run protected local read-only capacity probe
        shell: pwsh
        run: |
          $probe = 'C:\ProgramData\KhalilDigitalTwin\artifacts\runpod_capacity_readonly.ps1'

name: MesoAI MASTER-PC Chat STT Smoke

on:
  push:
    branches:
      - preflight-write/meso-next
    paths:
      - .github/meso-chat-stt-smoke-trigger.txt

permissions:
  contents: read

concurrency:
  group: meso-chat-stt-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64, khalil-master-pc]
    timeout-minutes: 15
    steps:
      - name: Checkout Meso preflight source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run local private transcription smoke test
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $python='C:\ProgramData\KhalilDigitalTwin\meso\fish-whisper-venv\Scripts\python.exe'
          $source='C:\MesoAI\private\profile-v1\source\normalized\meso_ref_01.wav'
          $helper=Join-Path $env:GITHUB_WORKSPACE 'tools\transcribe_chat_audio.py'
          $tmpRoot='C:\MesoAI\private\chat-stt\tmp'
          $modelRoot='C:\MesoAI\private\models\faster-whisper'
          foreach($p in @($python,$source,$helper)) {
            if (!(Test-Path -LiteralPath $p -PathType Leaf)) { throw "Required local STT dependency missing: $p" }
          }
          New-Item -ItemType Directory -Force -Path $tmpRoot,$modelRoot | Out-Null
          $tmp=Join-Path $tmpRoot ('meso-chat-smoke-' + [guid]::NewGuid().ToString('N') + '.wav')
          try {
            Copy-Item -LiteralPath $source -Destination $tmp -Force
            $env:MESO_CHAT_STT_TMP=$tmpRoot
            $env:MESO_CHAT_STT_MODEL_ROOT=$modelRoot
            $env:MESO_CHAT_STT_MODEL='small'
            $raw=& $python $helper $tmp 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'Meso local chat transcription helper returned non-zero.' }
            $result=($raw -join "`n") | ConvertFrom-Json
            if ($result.ok -ne $true) { throw 'Meso local chat transcription did not report success.' }
            $text=[string]$result.transcript
            if ([string]::IsNullOrWhiteSpace($text)) { throw 'Meso local chat transcription returned empty text.' }
            $bytes=[Text.Encoding]::UTF8.GetBytes($text)
            $sha=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
            Write-Host 'MESO_CHAT_STT_SMOKE=true'
            Write-Host "MESO_CHAT_STT_MODEL=$([string]$result.model)"
            Write-Host "MESO_CHAT_STT_LANGUAGE=$([string]$result.language)"
            Write-Host "MESO_CHAT_STT_DURATION_SECONDS=$([double]$result.duration_seconds)"
            Write-Host "MESO_CHAT_STT_TRANSCRIPT_CHARS=$($text.Length)"
            Write-Host "MESO_CHAT_STT_TRANSCRIPT_SHA256=$sha"
            Write-Host 'MESO_CHAT_STT_PROVIDER_UPLOAD=false'
          } finally {
            Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue
          }

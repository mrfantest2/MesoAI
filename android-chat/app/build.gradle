plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv('MESO_CHAT_STORE_FILE')
def releaseStorePassword = System.getenv('MESO_CHAT_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('MESO_CHAT_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MESO_CHAT_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace = 'win.fantest.mesochat'

    buildFeatures {
        buildConfig = true
    }
    compileSdk 35

    defaultConfig {
        applicationId 'win.fantest.mesochat'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) { signingConfig signingConfigs.release }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
